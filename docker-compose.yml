services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coupang_cart_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coupang_cart_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/coupang_cart_agent
      APP_PORT: 8080
    ports:
      - "8080:8080"
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "coupang_cart_agent",
        "serve-http",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--postgres-dsn",
        "postgresql://postgres:postgres@postgres:5432/coupang_cart_agent"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
    profiles: ["live"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/coupang_cart_agent
      COUPANG_BROWSER_LAUNCH_MODE: browser_use
      COUPANG_CHROME_USER_DATA_DIR: /operator-chrome
      COUPANG_CHROME_PROFILE_DIRECTORY: Profile 1
    volumes:
      - ./.artifacts:/app/.artifacts
      - ./.data:/app/.data
      - ${COUPANG_CHROME_USER_DATA_DIR_HOST:-/tmp/operator-chrome}:/operator-chrome:ro
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "coupang_cart_agent",
        "integration-live-telegram-worker",
        "--timeout",
        "30",
        "--sleep-seconds",
        "1",
        "--intake-db-path",
        ".artifacts/telegram_intake.sqlite3"
      ]

volumes:
  postgres-data:
